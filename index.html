<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vite replaces this restrictive default with the same policy plus only the validated public
      Supabase origin. Production never permits inline script/style. Development-only refresh,
      injected styles and local HMR websocket exceptions are generated by vite.config.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      data-review-csp
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>i18n String Reviewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
